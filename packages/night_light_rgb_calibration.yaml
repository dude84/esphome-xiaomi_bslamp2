# ------------------------------------------------------------------------
# RGB night light brightness calibration
#
# The RGB night light (a colored glow at the lowest brightness, e.g. a
# faint red for a nursery) operates at a fixed, measured brightness that
# is often still too bright for a dark room. This package exposes a Home
# Assistant number entity to scale that brightness down (or up) live,
# without reflashing.
#
# 100% keeps the original measured brightness. Values ABOVE 100% make the
# RGB night light brighter and values below make it dimmer. Because a
# single-channel color (e.g. pure red) is very faint at the stock 100%
# level, expect to go above 100% to reach a visible-but-dim glow. The
# value is restored across reboots. The multiplier is clamped to 4.0 (400%)
# in the component.
#
# Note: this only affects the RGB night light. The white (color
# temperature) night light is tuned via night_light_calibration.yaml.
# ------------------------------------------------------------------------

substitutions:
  night_light_rgb_level_name: Night Light Brightness (RGB)
  # Default level on a fresh device (before the user adjusts it). 100% is the
  # stock, very faint night light; 185% is a good visible-but-dim single-colour
  # (e.g. red) nursery glow.
  night_light_rgb_level_initial: "185"

esphome:
  on_boot:
    - priority: 600
      then:
        - script.execute: apply_night_light_rgb_brightness

script:
  - id: apply_night_light_rgb_brightness
    mode: restart
    then:
      # Store the new multiplier in the light component. This takes effect on
      # the next render of the light state.
      - lambda: |-
          if (isnan(id(my_night_light_rgb_level).state)) {
            return;
          }
          id(my_light).set_night_light_rgb_brightness(
            id(my_night_light_rgb_level).state / 100.0f);
      # Re-render the current light state through the normal light pipeline, so
      # the change is visible immediately while the night light is already on.
      # This is only done when the light is on, to avoid switching it on. Using
      # a light call (instead of a direct output write) keeps the light state
      # machine in sync, which is important to not get stuck in night mode.
      - if:
          condition:
            - light.is_on: my_light
          then:
            - light.turn_on:
                id: my_light
                transition_length: 0s

number:
  - platform: template
    id: my_night_light_rgb_level
    name: ${night_light_rgb_level_name}
    icon: mdi:brightness-5
    entity_category: config
    mode: slider
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    min_value: 0
    max_value: 400
    step: 5
    initial_value: ${night_light_rgb_level_initial}
    on_value:
      then:
        - script.execute: apply_night_light_rgb_brightness
